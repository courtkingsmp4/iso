<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO tests</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  body { padding: 24px; max-width: 760px; margin: 0 auto; }
  h1 { font-family: var(--font-display); font-size: 40px; margin: 0 0 4px; font-weight: 400; }
  #summary { font-size: 18px; margin: 12px 0 20px; }
  #summary.ok { color: var(--good); } #summary.bad { color: var(--them); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 6px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
  li .tag { width: 44px; font-weight: 600; } li.pass .tag { color: var(--good); } li.fail .tag { color: var(--them); }
  li small { display: block; color: var(--muted); }
</style>
</head>
<body>
<h1>ISO tests</h1>
<p><a href="../index.html">Back to the app</a></p>
<div id="summary">Running...</div>
<ul id="list"></ul>
<script type="module">
  import { runAll } from './harness.js';
  import './all.js';
  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  const res = await runAll((r) => {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = r.ok ? 'PASS' : 'FAIL';
    const body = document.createElement('div'); body.textContent = r.name;
    if (!r.ok) { const s = document.createElement('small'); s.textContent = r.error; body.append(s); }
    li.append(tag, body); list.append(li);
  });
  summary.textContent = `${res.passed} passed, ${res.failed} failed, ${res.results.length} total`;
  summary.className = res.failed ? 'bad' : 'ok';
  document.title = (res.failed ? 'FAIL' : 'PASS') + ' - ISO tests';
</script>
</body>
</html>
